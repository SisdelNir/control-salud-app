<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita — DR-SISDEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #1a2540 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 26px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 26px; margin-bottom: 6px; color: #22d3ee; font-weight: 800; }
        h2 { font-size: 18px; margin-bottom: 10px; color: white; font-weight: 700; }
        h3 { font-size: 15px; margin: 16px 0 10px; color: rgba(255,255,255,0.85); font-weight: 700; }
        p  { color: rgba(255,255,255,0.65); line-height: 1.5; font-size: 14px; }
        label { display: block; color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        input[type=text], input[type=tel], textarea {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15);
            color: white; padding: 12px 14px; border-radius: 10px; font-size: 14px;
            font-family: inherit; resize: vertical;
        }
        textarea { min-height: 70px; }
        button {
            font-family: inherit; cursor: pointer; border: none; border-radius: 10px;
            padding: 12px 22px; font-weight: 700; font-size: 14px;
            transition: transform 0.15s, opacity 0.15s;
        }
        button:hover:not(:disabled) { transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; }
        .loading { text-align: center; padding: 60px 20px; }
        .spinner {
            width: 38px; height: 38px; margin: 0 auto 16px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Mini-calendario */
        .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .cal-nav button {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: white; padding: 6px 14px; border-radius: 8px; font-size: 13px;
        }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .cal-head { text-align: center; font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; padding: 6px 0; font-weight: 700; }
        .cal-cell {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.15s;
        }
        .cal-cell.empty { background: transparent; border: none; cursor: default; }
        .cal-cell.disabled { color: rgba(255,255,255,0.2); cursor: not-allowed; background: rgba(255,255,255,0.01); }
        .cal-cell.available:hover { background: rgba(34,211,238,0.15); border-color: #22d3ee; transform: scale(1.05); }
        .cal-cell.selected { background: #22d3ee; color: #0f172a; border-color: #22d3ee; }
        .cal-cell.today { box-shadow: 0 0 0 2px rgba(34,211,238,0.4); }

        /* Slots */
        .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 10px; }
        .slot-btn {
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.3);
            color: #34d399; padding: 11px 6px; border-radius: 10px;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .slot-btn:hover { background: rgba(16,185,129,0.2); }
        .slot-btn.selected { background: #10b981; color: white; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; padding: 20px; backdrop-filter: blur(6px);
        }
        .modal-box {
            background: linear-gradient(145deg, #0f172a, #1a2540);
            border: 1px solid rgba(34,211,238,0.4);
            border-radius: 18px; padding: 28px;
            max-width: 460px; width: 100%;
            max-height: 90vh; overflow-y: auto;
        }
        .field { margin-bottom: 14px; }

        /* Confirmación */
        .success-box { text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 72px; margin-bottom: 14px; }

        .footer { text-align: center; padding: 18px; color: rgba(255,255,255,0.3); font-size: 11px; }
        .footer a { color: rgba(34,211,238,0.6); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando información del médico...</p>
            </div>
        </div>
        <div class="footer">DR-SISDEL · Clinical Management Software</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firestore-client.js"></script>
    <script src="agendar.js"></script>
</body>
</html>

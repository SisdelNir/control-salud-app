<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso DR-SISDEL - Código</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="description"
        content="Portal de acceso seguro para el sistema DR-SISDEL utilizando su código exclusivo.">
</head>

<body>
    <div class="background-blur"></div>
    <main class="container">
        <div class="glass-card animate-in"
            style="border: 2px solid #22d3ee; box-shadow: 0 0 25px rgba(34, 211, 238, 0.3);">
            <header>
                <div class="logo-container">
                    <svg class="heart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                            fill="currentColor" />
                    </svg>
                </div>
                <h1>DR-SISDEL</h1>
            </header>

            <form id="qsl-form">
                <div class="input-group" style="margin-bottom: 25px;">
                    <label id="input-label" for="login-code">CÓDIGO DE ACCESO</label>
                    <input type="password" id="login-code" placeholder="Ingrese su código..." maxlength="20"
                        autocomplete="off" autofocus>
                    <div class="input-focus-line"></div>
                </div>

                <div style="text-align: right; margin-bottom: 20px; font-size: 13px;">
                    <a href="#" id="open-register-modal"
                        style="color: var(--accent); text-decoration: none; transition: 0.3s; padding: 4px; display: inline-block;">
                        ¿Eres médico sin acceso? <strong>Solicitar a SISDEL</strong>
                    </a>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    <span>Iniciar Sesión</span>
                    <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </form>

            <footer>
                <p>&copy; 2026 DR-SISDEL. Todos los derechos reservados.</p>
            </footer>
        </div>

        <!-- Registro Médico Modal -->
        <div id="register-modal"
            style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
            <div class="glass-card animate-in"
                style="width: 100%; max-width: 450px; padding: 30px; box-shadow: 0 0 30px rgba(34, 211, 238, 0.2); border: 2px solid rgba(34, 211, 238, 0.45);">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
                    <h3 style="margin: 0; color: #fff; font-size: 20px;">Solicitud de Acceso a SISDEL</h3>
                    <button id="close-register-modal"
                        style="background: none; border: none; color: white; font-size: 24px; cursor: pointer;">&times;</button>
                </div>
                <p style="font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 25px;">Por favor, complete estos
                    datos para validar su credencial médica y habilitar su portal.</p>
                <form id="register-form">
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label for="reg-name">NOMBRE COMPLETO DEL MÉDICO</label>
                        <input type="text" id="reg-name" required placeholder="Ej. Dr. Juan Pérez" autocomplete="off">
                    </div>
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label for="reg-license">NÚMERO DE LICENCIA / COLEGIADO *</label>
                        <input type="text" id="reg-license" required placeholder="Ej. 12345" autocomplete="off"
                            style="border-bottom: 1px solid var(--accent);">
                    </div>
                    <div class="input-group" style="margin-bottom: 15px;">
                        <label for="reg-specialty">ESPECIALIDAD</label>
                        <input type="text" id="reg-specialty" required placeholder="Ej. Medicina General"
                            autocomplete="off">
                    </div>
                    <div class="input-group" style="margin-bottom: 25px;">
                        <label for="reg-contact">CORREO O TELÉFONO DE CONTACTO</label>
                        <input type="text" id="reg-contact" required placeholder="Poder notificarle sus claves..."
                            autocomplete="off">
                    </div>
                    <button type="submit" class="btn-primary"
                        style="width: 100%; background: linear-gradient(135deg, var(--accent) 0%, #0d9488 100%);">
                        Enviar Solicitud
                    </button>
                </form>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>

</html>
